<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round of 32 Slot Bracket</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #9aa4b2;
      --line-strong: #65758b;
      --accent: #0f766e;
      --r32: #eef6f4;
      --placeholder: #f3f5f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
        sans-serif;
    }

    main {
      padding: 24px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 12px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }


    .chart-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .copy-chart {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      padding: 7px 9px;
    }

    .copy-chart:hover {
      border-color: #aeb7c6;
      background: #f9fafb;
    }

    .copy-chart:disabled {
      cursor: progress;
      opacity: 0.64;
    }

    .copy-status {
      color: var(--muted);
      font-size: 12px;
      min-height: 1em;
    }


    .bracket-scroll {
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .bracket-svg {
      display: block;
      max-width: none;
      background: #ffffff;
      border: 1px solid #e0e5ee;
      border-radius: 8px;
    }

    .svg-bg {
      fill: #ffffff;
    }

    .connector {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .match-card {
      width: 320px;
      min-height: 226px;
      height: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid #d4dae4;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(23, 32, 51, 0.06);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
        sans-serif;
    }

    .match-card.r32 {
      background: linear-gradient(180deg, var(--panel), var(--r32));
      padding: 8px 9px;
    }

    .match-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.1;
    }

    .match-head small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .slot {
      border-top: 1px solid #e2e7ef;
      padding-top: 5px;
    }

    .slot + .slot {
      margin-top: 6px;
    }

    .slot-head {
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .team-prob {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 8px;
      min-height: 15px;
      font-size: 10.5px;
      line-height: 1.16;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .prob {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 760;
      white-space: nowrap;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--placeholder);
      border-style: solid;
      padding: 10px;
    }

    .placeholder-inner {
      text-align: center;
    }

    .round-label {
      color: var(--accent);
      font-size: 13px;
      font-weight: 820;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .match-id {
      font-size: 17px;
      font-weight: 780;
      margin-bottom: 7px;
    }

    .sources {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
    }

    .f {
      background: #ffffff;
      border-color: var(--line-strong);
      border-width: 1.5px;
    }

    .note {
      max-width: 980px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>

  <script>

    async function svgToPngBlob(svg, stats) {
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");

      const viewBox = clone.viewBox.baseVal;
      const width = viewBox && viewBox.width ? viewBox.width : clone.clientWidth;
      const height = viewBox && viewBox.height ? viewBox.height : clone.clientHeight;
      const statTexts = stats
        ? Array.from(stats.querySelectorAll("span")).map((span) =>
            span.textContent.trim()
          )
        : [];
      const statsHeight = statTexts.length ? 32 : 0;
      const exportHeight = height + statsHeight;
      const scale = Math.max(2, window.devicePixelRatio || 1);
      clone.setAttribute("width", width);
      clone.setAttribute("height", exportHeight);
      clone.setAttribute("viewBox", `0 0 ${width} ${exportHeight}`);

      const background = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );
      background.setAttribute("x", "0");
      background.setAttribute("y", "0");
      background.setAttribute("width", width);
      background.setAttribute("height", exportHeight);
      background.setAttribute("fill", "#ffffff");
      clone.insertBefore(background, clone.firstChild);

      if (statTexts.length) {
        const statsGroup = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "g"
        );
        const columnWidth = width / statTexts.length;

        statTexts.forEach((statText, index) => {
          const text = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );
          text.setAttribute("x", columnWidth * index + columnWidth / 2);
          text.setAttribute("y", height + 21);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("fill", "#667085");
          text.setAttribute("font-size", "10.5");
          text.setAttribute("font-weight", "650");
          text.setAttribute(
            "font-family",
            "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          );
          text.textContent = statText;
          statsGroup.appendChild(text);
        });

        clone.appendChild(statsGroup);
      }

      const serializer = new XMLSerializer();
      const svgText = serializer.serializeToString(clone);
      const svgBlob = new Blob([svgText], {
        type: "image/svg+xml;charset=utf-8",
      });
      const url = URL.createObjectURL(svgBlob);

      try {
        const image = new Image();
        image.decoding = "async";
        image.src = url;
        await image.decode();

        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(width * scale);
        canvas.height = Math.ceil(exportHeight * scale);

        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("Could not create PNG"));
            }
          }, "image/png");
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function downloadPngBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename || "chart.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function copyChartAsPng(button) {
      const block = button.closest(".chart-block");
      const svg = block.querySelector("svg");
      const stats = block.querySelector(".stats");
      const status = block.querySelector(".copy-status");

      button.disabled = true;
      status.textContent = "Copying...";

      try {
        const blob = await svgToPngBlob(svg, stats);
        if (!navigator.clipboard || !window.ClipboardItem) {
          downloadPngBlob(blob, button.dataset.filename);
          status.textContent = "Downloaded";
          return;
        }

        await navigator.clipboard.write([
          new ClipboardItem({ "image/png": blob }),
        ]);
        status.textContent = "Copied";
      } catch (error) {
        console.error(error);
        status.textContent = "Copy failed";
      } finally {
        button.disabled = false;
        window.setTimeout(() => {
          if (
            status.textContent === "Copied" ||
            status.textContent === "Downloaded"
          ) {
            status.textContent = "";
          }
        }, 2200);
      }
    }

    document.querySelectorAll(".copy-chart").forEach((button) => {
      button.addEventListener("click", () => copyChartAsPng(button));
    });

  </script>
