<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leader Table Visualisations</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d7dce5;
      --grid: #edf0f5;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      max-width: 1450px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 720;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 2px rgb(16 24 40 / 5%);
    }

    .chart-block {
      overflow-x: auto;
    }


    .chart-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .copy-chart {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      padding: 7px 9px;
    }

    .copy-chart:hover {
      border-color: #aeb7c6;
      background: #f9fafb;
    }

    .copy-chart:disabled {
      cursor: progress;
      opacity: 0.64;
    }

    .copy-status {
      color: var(--muted);
      font-size: 12px;
      min-height: 1em;
    }


    svg {
      display: block;
      width: 100%;
      min-width: 1600px;
      height: auto;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 700;
      fill: var(--text);
    }

    .axis-label {
      font-size: 11px;
      fill: var(--muted);
    }

    .axis-line {
      stroke: var(--line);
      stroke-width: 1.2;
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .series-line {
      fill: none;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .point-marker {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji",
        Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 18px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .label-connector {
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      opacity: 0.72;
    }

    .series-label {
      font-size: 12px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    @media (max-width: 720px) {
      main {
        padding: 18px 12px 28px;
      }
      .meta {
        margin-top: 6px;
      }
    }
  </style>

          const text = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );
          text.setAttribute("x", columnWidth * index + columnWidth / 2);
          text.setAttribute("y", height + 21);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("fill", "#667085");
          text.setAttribute("font-size", "10.5");
          text.setAttribute("font-weight", "650");
          text.setAttribute(
            "font-family",
            "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          );
          text.textContent = statText;
          statsGroup.appendChild(text);
        });

        clone.appendChild(statsGroup);
      }

      const serializer = new XMLSerializer();
      const svgText = serializer.serializeToString(clone);
      const svgBlob = new Blob([svgText], {
        type: "image/svg+xml;charset=utf-8",
      });
      const url = URL.createObjectURL(svgBlob);

      try {
        const image = new Image();
        image.decoding = "async";
        image.src = url;
        await image.decode();

        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(width * scale);
        canvas.height = Math.ceil(exportHeight * scale);

        const context = canvas.getContext("2d");
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        return await new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("Could not create PNG"));
            }
          }, "image/png");
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function downloadPngBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename || "chart.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function copyChartAsPng(button) {
      const block = button.closest(".chart-block");
      const svg = block.querySelector("svg");
      const stats = block.querySelector(".stats");
      const status = block.querySelector(".copy-status");

      button.disabled = true;
      status.textContent = "Copying...";

      try {
        const blob = await svgToPngBlob(svg, stats);
        if (!navigator.clipboard || !window.ClipboardItem) {
          downloadPngBlob(blob, button.dataset.filename);
          status.textContent = "Downloaded";
          return;
        }

        await navigator.clipboard.write([
          new ClipboardItem({ "image/png": blob }),
        ]);
        status.textContent = "Copied";
      } catch (error) {
        console.error(error);
        status.textContent = "Copy failed";
      } finally {
        button.disabled = false;
        window.setTimeout(() => {
          if (
            status.textContent === "Copied" ||
            status.textContent === "Downloaded"
          ) {
            status.textContent = "";
          }
        }, 2200);
      }
    }

    document.querySelectorAll(".copy-chart").forEach((button) => {
      button.addEventListener("click", () => copyChartAsPng(button));
    });

  </script>
</body>
</html>
